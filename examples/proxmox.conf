# stickBar: Proxmox server box (docs/modules/proxmox.md)
#
# Copy to ~/.config/stickBar/proxmox.conf, put your own values in, and
#   chmod 600 ~/.config/stickBar/proxmox.conf
# (it holds an API token; the bar warns if others can read it).
# Without that file there's no Proxmox box. The bar reads it once at start:
# restart the bar after editing it.
#
# One `key = value` per line; unknown keys are an error.

# The API's base URL. Must be https://.
url   = https://192.168.0.50:8006

# A read-only API token, `user@realm!tokenid=secret` (role PVEAuditor; add
# Sys.PowerMgmt on the node for the Shut down chip). Making one:
#   pveum user token add root@pam stickbar --privsep 1
#   pveum acl modify / --tokens 'root@pam!stickbar' --roles PVEAuditor
token = root@pam!stickbar=00000000-0000-0000-0000-000000000000

# Optional, but needed with Proxmox's self-signed certificate: the hash of the
# server's public key. Get yours with:
#   echo | openssl s_client -connect 192.168.0.50:8006 2>/dev/null \
#     | openssl x509 -pubkey -noout | openssl pkey -pubin -outform der \
#     | openssl dgst -sha256 -binary | base64
pin   = sha256//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# The server's network card, for the Wake chip (Wake-on-LAN must be on in its
# BIOS and NIC: `ethtool <nic>` shows `Wake-on: g`).
mac   = 00:11:22:33:44:55
