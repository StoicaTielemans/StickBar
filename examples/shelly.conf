# stickBar: Shelly smart plugs (docs/modules/shelly.md)
#
# Copy to ~/.config/stickBar/shelly.conf and put your own plugs in.
# Without that file the media dropdown has no smart-plug card.
# The bar reads it once at start: restart the bar after editing it.
#
# One plug per line, `name = IP` (or `IP:port`), in the order the card shows
# them. At most 12 plugs; names up to 32 characters, each used once.
#
# - Gen2 and newer only (Plus/Pro/Gen3/Gen4); a Gen1 plug shows "not Gen2+".
# - IPs only, no host names. Find them in the Shelly app (device > Settings >
#   Device info) or your router's client list, and give each plug a DHCP
#   reservation so the IP never changes.
# - No password: with authentication on, the row shows "password set".

desk    = 192.168.1.51
tv      = 192.168.1.52
kitchen = 192.168.1.50
